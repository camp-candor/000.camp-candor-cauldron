name: Deploy Cloudflare

on:
    push:
        branches: [main]
        paths:
            - 'apps/dashboard/**'
            - '.github/workflows/deploy-cf.yml'
            - 'package.json'
            - 'package-lock.json'
    workflow_dispatch:

concurrency:
    group: deploy-dashboard-${{ github.ref }}
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        name: Deploy Astro Dashboard
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Install Dependencies
              run: npm ci

            - name: Build Dashboard
              working-directory: apps/dashboard
              run: |
                  npm run build
                  node -e "const p='dist/server/wrangler.json', fs=require('fs'); if(fs.existsSync(p)){ const d=JSON.parse(fs.readFileSync(p)); delete d.kv_namespaces; fs.writeFileSync(p, JSON.stringify(d, null, 2)); }"

            - name: Deploy to Cloudflare
              working-directory: apps/dashboard
              run: npx wrangler deploy
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
